<!doctype html>
<html lang="zh-CN">
<head>

  <title>QuantBuddy Community Phase 2 发布页面</title>
  <style>
    :root{--p:#5945f5;--ink:#14203a;--muted:#75819a;--line:#e5e8f1;--bg:#f7f8fd;font-family:Inter,"Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 72% 3%,#eeeaff 0,transparent 27%),var(--bg)}button,input,textarea,select{font:inherit}.sidebar{position:fixed;inset:0 auto 0 0;width:252px;display:flex;flex-direction:column;padding:30px 18px 18px;border-right:1px solid #e0e4ee;background:#fff}.brand{display:flex;align-items:center;gap:10px;padding:0 14px;font-size:21px;font-weight:800}.brand b{color:var(--p)}.logo{position:relative;display:block;overflow:hidden;width:40px;aspect-ratio:337/318}.logo img{position:absolute;top:-98.74%;left:-182.79%;width:455.79%;max-width:none}.nav{display:flex;flex-direction:column;gap:9px;margin-top:48px}.nav a{display:flex;min-height:54px;align-items:center;gap:17px;padding:0 22px;border-radius:12px;color:#26324f;text-decoration:none;font-weight:650}.nav a.active{color:#4839f6;background:linear-gradient(90deg,#f0eeff,#f7f5ff)}.profile{display:grid;grid-template-columns:42px 1fr 16px;gap:10px;align-items:center;margin-top:auto;padding:13px 12px;border:1px solid var(--line);border-radius:13px;box-shadow:0 9px 28px #3033540f}.avatar{display:grid;width:42px;height:42px;place-items:center;border-radius:50%;color:#fff;background:linear-gradient(145deg,#f2a56f,#7d55e8);font-size:10px;font-weight:800}.profile span{display:flex;flex-direction:column;gap:3px}.profile small{color:#75809a}.main{margin-left:252px;padding:32px 42px 48px}.page{max-width:1450px;margin:auto}.preview-note{position:fixed;z-index:5;right:20px;top:15px;padding:8px 12px;border:1px solid #d9d3ff;border-radius:9px;color:#4e3bd5;background:#fff;box-shadow:0 8px 25px #30285d1a;font-size:11px}.switcher{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}.switcher button{height:36px;padding:0 15px;border:1px solid #dfe3ee;border-radius:9px;color:#59657e;background:#fff;cursor:pointer;font-size:12px;font-weight:700}.switcher button.on{border-color:#9588ff;color:#fff;background:var(--p)}.crumb{display:flex;gap:8px;color:#7b879f;font-size:12px}.header{display:flex;align-items:flex-start;gap:13px;margin:14px 0 24px}.back{display:grid;width:42px;height:42px;place-items:center;border:1px solid #dde1eb;border-radius:10px;color:#536079;background:#fff;cursor:pointer;font-size:21px}.header h1{margin:0;font-size:31px}.header p{margin:7px 0 0;color:#75819a}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}.card,.help{border:1px solid var(--line);border-radius:17px;background:#fff;box-shadow:0 13px 38px #3b3f660f}.card{padding:27px 29px 18px}.section-title h2{margin:0;font-size:20px}.section-title p{margin:7px 0 22px;color:#8791a7;font-size:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{position:relative;display:grid;gap:8px;margin-bottom:19px;color:#2e3954;font-size:12px;font-weight:700}.field b{color:#df3d56}.field input,.field select,.field textarea{width:100%;border:1px solid #dde2ed;border-radius:10px;outline:0;color:#202b45;background:#fff}.field input,.field select{height:48px;padding:0 14px}.field textarea{min-height:105px;padding:13px 14px;resize:vertical;line-height:1.65}.field input:focus,.field select:focus,.field textarea:focus{border-color:#8d80fa;box-shadow:0 0 0 3px #5c48f116}.formula{display:grid;grid-template-columns:42px 1fr;overflow:hidden;border:1px solid #dde2ed;border-radius:10px;background:#fbfcff}.formula span{padding-top:17px;border-right:1px solid #e6e9f2;color:#98a2b6;text-align:center}.formula textarea{min-height:145px;border:0;border-radius:0;color:#342765;background:transparent;font-family:Consolas,monospace}.hint{margin:-11px 0 18px;color:#8792a8;font-size:10px}.hint a{color:var(--p)}.tags{display:flex;flex-wrap:wrap;gap:8px}.tags button{min-height:37px;padding:0 13px;border:1px solid #dfe3ed;border-radius:9px;color:#58647e;background:#fff;cursor:pointer;font-size:11px}.tags button.on{border-color:#9183ff;color:#5643e9;background:#f0edff}.config{display:grid;grid-template-columns:repeat(3,1fr);overflow:hidden;margin-bottom:17px;border:1px solid #e5e8f1;border-radius:11px;background:#fafbff}.config span{padding:14px;border-right:1px solid #e8eaf2;border-bottom:1px solid #e8eaf2}.config span:nth-child(3n){border-right:0}.config span:nth-last-child(-n+3){border-bottom:0}.config small,.metrics small{display:block;color:#808ba2;font-size:10px}.config strong,.metrics strong{display:block;margin-top:6px;font-size:12px}.part{padding:0 0 22px;margin-bottom:22px;border-bottom:1px solid #eceef4}.part:last-child{border:0;margin:0}.metrics{display:grid;grid-template-columns:repeat(6,1fr);overflow:hidden;border:1px solid #ddd8fb;border-radius:11px;background:linear-gradient(90deg,#f7f5ff,#fff)}.metrics span{padding:14px 11px}.metrics strong{color:#5542ee}.actions{display:flex;justify-content:space-between;gap:12px;padding-top:16px;border-top:1px solid #eceef4}.actions button{min-height:44px;padding:0 24px;border-radius:10px;cursor:pointer;font-weight:750}.draft{border:1px solid #dce1eb;color:#56627c;background:#fff}.publish{min-width:250px;border:0;color:#fff;background:linear-gradient(135deg,#543df2,#6849f8);box-shadow:0 10px 22px #513cef33}.right{display:flex;flex-direction:column;gap:16px}.help{padding:23px}.help h2{margin:0 0 16px;font-size:18px}.help h3{margin:13px 0 5px;font-size:13px}.help p,.help li{color:#748099;font-size:11px;line-height:1.7}.help ul{display:grid;gap:10px;padding:0;list-style:none}.help li:before{margin-right:8px;color:var(--p);content:"✓"}.status{border-color:#d8d2ff;background:linear-gradient(145deg,#fff,#f4f1ff)}.status strong{display:inline-block;padding:6px 10px;border-radius:99px;color:#5945e9;background:#ece8ff;font-size:11px}.modal-bg{position:fixed;z-index:20;inset:0;display:none;place-items:center;padding:20px;background:#17192b66;backdrop-filter:blur(5px)}.modal-bg.open{display:grid}.modal{width:min(640px,100%);padding:23px;border-radius:18px;background:#fff;box-shadow:0 30px 90px #191c3540}.modal header{display:flex;justify-content:space-between}.modal h2{margin:0}.close{width:35px;height:35px;border:0;border-radius:9px;cursor:pointer}.post-preview{margin:18px 0;padding:20px;border:1px solid #e6e8f1;border-radius:14px;background:#faf9ff}.author{display:flex;align-items:center;gap:9px}.author .avatar{width:34px;height:34px}.author em{margin-left:auto;padding:5px 9px;border-radius:99px;color:#5d49e9;background:#eeeaff;font-size:10px;font-style:normal}.post-preview h3{font-size:21px}.post-preview p{color:#68758e}.post-preview code{display:block;padding:12px;border-radius:9px;color:#332861;background:#f1efff}.modal footer{display:flex;justify-content:flex-end;gap:10px}.modal footer button{min-height:40px;padding:0 17px;border:1px solid #dfe2ec;border-radius:9px;background:#fff;cursor:pointer}.modal footer .confirm{border:0;color:#fff;background:var(--p)}.toast{position:fixed;z-index:30;right:25px;bottom:25px;display:none;padding:13px 17px;border:1px solid #d9d3ff;border-radius:11px;color:#3e326e;background:#fff;box-shadow:0 16px 44px #2b274f2e}.toast.show{display:block}.error{display:none;margin:-12px 0 12px;color:#d33b54;font-size:11px}.error.show{display:block}.detail-success{text-align:center;padding:55px}.detail-success i{display:grid;width:60px;height:60px;place-items:center;margin:auto;border-radius:50%;color:#fff;background:var(--p);font-size:28px;font-style:normal}.detail-success h2{font-size:27px}.detail-success p{color:var(--muted)}
    @media(max-width:1100px){.layout{grid-template-columns:1fr}.right{display:grid;grid-template-columns:1fr 1fr}.status{grid-column:1/-1}.metrics{grid-template-columns:repeat(3,1fr)}}@media(max-width:820px){.sidebar{transform:translateX(-100%)}.main{margin-left:0;padding:78px 16px 30px}.grid2,.config,.right,.metrics{grid-template-columns:1fr}.config span{border-right:0}.actions{flex-direction:column-reverse}.actions button{width:100%;min-width:0}.preview-note{left:16px;right:auto}.header h1{font-size:27px}}
  </style>
</head>
<body>
<div class="preview-note">Phase 2 · 可直接打开的交互 HTML</div>
<aside class="sidebar"><div class="brand"><span class="logo"><img src="frontend/public/quantbuddy-logo.png" alt="QuantBuddy 产品图标"></span><span>Quant<b>Buddy</b></span></div><nav class="nav"><a href="#">⌂　首页</a><a href="#">☷　我的策略</a><a href="#">↗　回测研究</a><a href="#">▣　模拟盘</a><a class="active" href="#">◯　社区</a><a href="#">✦　QuantBuddy</a><a href="#">⚙　设置</a></nav><div class="profile"><span class="avatar">AZ</span><span><strong>Anna Zhang</strong><small>社区成员</small></span><b>⌄</b></div></aside>
<main class="main"><div class="page"><div class="switcher"><button class="on" data-kind="factor">发布因子</button><button data-kind="module">发布策略模块</button><button data-kind="strategy">发布完整策略</button><button data-kind="question">发布提问</button></div><div id="app"></div></div></main>
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()"><section class="modal"><header><h2>发布预览</h2><button class="close" onclick="closeModal()">×</button></header><div class="post-preview" id="preview"></div><footer><button onclick="closeModal()">继续编辑</button><button class="confirm" onclick="publishNow()">确认发布</button></footer></section></div><div class="toast" id="toast"></div>
<script>
const meta={factor:['发布因子','把一个量化想法整理成可计算、可验证的因子'],module:['发布策略模块','把一个可复用的选股、组合或风控规则整理成策略模块'],strategy:['发布完整策略','选择并分享你在“我的策略”中已完成回测的完整策略'],question:['发布提问','在社区里提问、交流想法，和大家一起讨论量化问题']};let kind='factor';
const fields={factor:()=>`<div class="section-title"><h2>基本信息</h2><p>填写因子基本信息，确保因子清晰、可理解。</p></div><div class="grid2"><label class="field">因子名称 <b>*</b><input id="name" placeholder="例如：过去20日波动率"></label><label class="field">因子类型 <b>*</b><select id="type"><option value="">请选择因子类型</option><option>动量因子</option><option>波动率因子</option><option>成交量因子</option><option>价格因子</option><option>技术因子</option><option>复合因子</option><option>其他</option></select></label></div><label class="field">因子公式 <b>*</b><div class="formula"><span>1</span><textarea id="formula" placeholder="Std($close / Ref($close, 1) - 1, 20)"></textarea></div></label><p class="hint">直接输入因子公式，可以使用 Std、Ref、Rank 等。<a href="#">需要帮助？问问 QuantBuddy</a></p><label class="field">详细说明<textarea id="description" placeholder="说明这个想法来自哪里、为什么可能有效，以及需要注意的问题。"></textarea></label>`,module:()=>`<div class="section-title"><h2>基本信息</h2><p>填写模块名称、类型和规则，方便其他人理解与复用。</p></div><div class="grid2"><label class="field">模块名称 <b>*</b><input id="name" placeholder="例如：趋势降仓模块"></label><label class="field">模块类型 <b>*</b><select id="type" onchange="stageHint()"><option value="risk_control">风险控制模块</option><option value="stock_selection">选股模块</option><option value="weighting">权重分配模块</option><option value="rebalance">调仓模块</option><option value="cash_management">现金管理模块</option><option value="execution">交易执行模块</option></select></label></div><p class="hint" id="stage">该模块通常用于风险控制环节，适用阶段由系统自动映射。</p><label class="field">规则说明 <b>*</b><input id="summary" placeholder="当市场趋势走弱时，降低股票总仓位。"></label><label class="field">模块规则 <b>*</b><div class="formula"><span>1</span><textarea id="formula" placeholder="If(IndexClose < MA(IndexClose, 120), PortfolioWeight * 0.5, PortfolioWeight)"></textarea></div></label><p class="hint">规则仅作为文本保存，不会在浏览器中执行。</p><label class="field">详细说明<textarea id="description" placeholder="说明这个模块解决什么问题、应如何使用，以及需要注意的情况。"></textarea></label>`,strategy:()=>`<section class="part"><div class="section-title"><h2>1　选择要发布的策略</h2><p>仅显示你在“我的策略”中已完成回测的完整策略。</p></div><label class="field">完整策略 <b>*</b><select><option>沪深300 LightGBM Top-5</option></select></label></section><section class="part"><div class="section-title"><h2>2　策略配置摘要</h2><p>配置来自已完成回测的策略，在发布页中只读。</p></div><div class="config"><span><small>股票池</small><strong>沪深300</strong></span><span><small>因子 / 特征集</small><strong>Qlib Alpha158 · 158个特征</strong></span><span><small>预测模型</small><strong>LightGBM</strong></span><span><small>选股模块</small><strong>Top-5选股</strong></span><span><small>调仓模块</small><strong>每日调仓，最多替换1只</strong></span><span><small>风险控制模块</small><strong>基础回撤控制</strong></span></div></section><section class="part"><div class="section-title"><h2>3　发布介绍</h2><p>向社区介绍你的策略，帮助他人更好理解和使用。</p></div><label class="field">标题 <b>*</b><input id="name" maxlength="60" placeholder="沪深300 LightGBM Top-5：一次面向初学者的 Qlib 实验"></label><label class="field">一句话介绍 <b>*</b><input id="summary" maxlength="80" placeholder="用一句话概括你的策略核心思想"></label><label class="field">详细说明<textarea id="description" maxlength="1000" placeholder="详细介绍策略逻辑、使用方法和适用场景（可选）"></textarea></label><label class="field">标签（可选）<div class="tags">${['量化选股','机器学习','沪深300','中高换手'].map(x=>`<button type="button" class="on" onclick="this.classList.toggle('on')">${x}</button>`).join('')}</div></label></section><section class="part"><div class="section-title"><h2>4　关联回测结果</h2><p>自动关联所选策略的最新有效回测。</p></div><div class="metrics"><span><small>回测版本</small><strong>bt_v2</strong></span><span><small>回测区间</small><strong>2024-01-02 — 2026-07-29</strong></span><span><small>累计收益</small><strong>261.32%</strong></span><span><small>年化收益</small><strong>68.28%</strong></span><span><small>Sharpe</small><strong>1.64</strong></span><span><small>最大回撤</small><strong>-22.28%</strong></span></div></section>`,question:()=>`<div class="section-title"><h2>发布提问</h2><p>越具体的问题越容易获得有帮助的回答。</p></div><label class="field">标题 <b>*</b><input id="name" placeholder="为什么我的策略收益很高，但 Rank IC 很低？"></label><label class="field">内容<textarea id="description" style="min-height:190px" placeholder="详细描述你的问题或想法，越具体越容易得到帮助。"></textarea></label><label class="field">标签（可选）<div class="tags">${['新手提问','回测问题','因子讨论','模型讨论','策略交流','产品建议','随便聊聊'].map(x=>`<button type="button" onclick="this.classList.toggle('on')">${x}</button>`).join('')}</div></label>`};
function help(){if(kind==='factor')return`<section class="help"><h2>新手提示</h2><h3>什么是因子？</h3><p>因子是用一个数字描述股票某种特征，例如动量、波动率或成交量变化。</p><h3>不用担心公式</h3><p>不懂公式也没关系，可以随时找 QuantBuddy 帮你梳理。</p></section><section class="help"><h2>发布后会展示什么？</h2><ul><li>因子逻辑与计算方式</li><li>IC、Rank IC 等验证结果（如有）</li><li>其他用户的 Star、评论和 Fork</li></ul></section>`;if(kind==='module')return`<section class="help"><h2>新手提示</h2><h3>什么是策略模块？</h3><p>完整策略中的可复用环节，例如选股、权重分配、调仓或风险控制。</p><h3>它和完整策略有什么区别？</h3><p>策略模块通常需要加入完整策略后才能运行。</p></section><section class="help"><h2>发布后会展示什么？</h2><ul><li>模块类型</li><li>规则逻辑与表达式</li><li>其他用户的 Star、评论和 Fork</li></ul></section>`;if(kind==='strategy')return`<section class="help"><h2>发布说明</h2><p>只读取已经完成回测的策略，不修改配置或结果。</p><ul><li>配置与回测保持只读</li><li>发布后支持 Star、评论和 Fork</li><li>Fork 后仍需重新回测</li></ul></section>`;return`<section class="help"><h2>这里可以聊什么？</h2><ul><li>询问不懂的量化概念</li><li>讨论回测数据和问题</li><li>分享策略想法与优化思路</li><li>提出产品建议或随便聊聊</li></ul></section>`}
function render(){const [title,sub]=meta[kind];document.getElementById('app').innerHTML=`<div class="crumb"><span>社区</span><span>›</span><b>${title}</b></div><header class="header"><button class="back" onclick="history.back()">←</button><div><h1>${title}</h1><p>${sub}</p></div></header><div class="layout"><form class="card" onsubmit="submitForm(event)">${fields[kind]()}<div class="error" id="error">请先填写所有必填项</div><div class="actions"><button class="draft" type="button" onclick="saveDraft()">保存草稿</button><button class="publish" type="submit">${kind==='question'?'发布到社区':'预览并发布 →'}</button></div></form><aside class="right">${help()}<section class="help status"><h2>当前状态</h2><strong id="state">草稿未保存</strong><p>草稿只保存在当前浏览器，不会出现在公开社区信息流。</p></section></aside></div>`}
document.querySelectorAll('.switcher button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.switcher button').forEach(x=>x.classList.remove('on'));b.classList.add('on');kind=b.dataset.kind;render()});
function values(){return{name:document.getElementById('name')?.value||'',type:document.getElementById('type')?.value||'',formula:document.getElementById('formula')?.value||'',summary:document.getElementById('summary')?.value||'',description:document.getElementById('description')?.value||'',tags:[...document.querySelectorAll('.tags button.on')].map(x=>x.textContent)}}function valid(v){return kind==='factor'?v.name&&v.type&&v.formula:kind==='module'?v.name&&v.type&&v.summary&&v.formula:kind==='strategy'?v.name&&v.summary:v.name}function saveDraft(){localStorage.setItem('quantbuddy.phase2.static.'+kind,JSON.stringify(values()));document.getElementById('state').textContent='草稿已保存';toast('草稿已保存，仅当前浏览器可见')}function submitForm(e){e.preventDefault();const v=values(),err=document.getElementById('error');if(!valid(v)){err.classList.add('show');return}err.classList.remove('show');if(kind==='question'){publishNow();return}document.getElementById('preview').innerHTML=`<div class="author"><span class="avatar">AZ</span><strong>Anna Zhang</strong><em>${meta[kind][0].replace('发布','')}</em></div><h3>${v.name}</h3><p>${v.summary||v.description||v.formula}</p>${v.formula?`<code>${v.formula}</code>`:''}${v.tags.length?`<p>${v.tags.join(' · ')}</p>`:''}`;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}function publishNow(){closeModal();const v=values();document.querySelector('.layout').innerHTML=`<section class="card detail-success"><i>✓</i><h2>发布成功</h2><p>${v.name||'内容'} 已创建为 Community Post。</p><button class="publish" onclick="render()">返回发布页面</button></section>`;toast('发布成功，静态预览已生成帖子详情效果')}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}function stageHint(){const map={risk_control:'风险控制',stock_selection:'选股',weighting:'组合构建',rebalance:'调仓',cash_management:'组合构建',execution:'交易执行'};document.getElementById('stage').textContent=`该模块通常用于${map[document.getElementById('type').value]}环节，适用阶段由系统自动映射。`}render();
</script>
</body>
</html>
