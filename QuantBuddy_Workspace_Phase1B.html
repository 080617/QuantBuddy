er;gap:16px;min-height:104px;padding:18px 21px;border:1px solid #e3e6ef;border-radius:15px;background:#fff;box-shadow:0 13px 36px #353a5f0d;cursor:pointer;text-align:left}.stat.active{border-color:#aaa1ff}.si{display:grid;width:58px;height:58px;place-items:center;border-radius:50%;font-size:26px}.purple{color:#5945f3;background:#efedff}.orange{color:#ee7c13;background:#fff0df}.green{color:#19a957;background:#e8f8ee}.stat span:nth-child(2){display:grid;gap:6px}.stat small{font-weight:700}.stat strong{font-size:29px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);margin-top:20px;border:1px solid #e1e4ed;border-radius:12px;overflow:hidden;background:#fff}.tabs button{height:54px;border:0;border-right:1px solid #e5e7ee;background:#fff;color:#536079;font-weight:700;cursor:pointer}.tabs button.active{color:#4e3df0;background:#fbfaff;box-shadow:inset 0 -2px #5a46f4}.list{display:grid;gap:14px;margin-top:18px}.card{padding:18px 20px;border:1px solid #e4e7ef;border-radius:15px;background:#fff;box-shadow:0 14px 38px #373b5f0e}.card header{display:flex;align-items:center;gap:14px}.icon{width:50px;height:50px;border-radius:11px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#765cff,#4e38ee);font-size:22px}.card h2{margin:0;font-size:18px}.card header p,.muted{margin:5px 0 0;color:#74809a;font-size:12px}.badge{margin-left:auto;padding:5px 10px;border-radius:99px;color:#159249;background:#e8f8ee;font-size:11px;font-weight:700}.badge.draft{color:#d97814;background:#fff0df}.grid4{display:grid;grid-template-columns:repeat(4,1fr);margin-top:14px;border:1px solid #e7eaf1;border-radius:9px;overflow:hidden}.grid4 span,.summary span{display:grid;gap:5px;padding:11px 13px;border-right:1px solid #e8eaf1}.grid4 small,.summary small{color:#78839c;font-size:10px}.grid4 strong,.summary strong{font-size:12px}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:13px}.actions button,.actions a{padding:9px 15px;border:1px solid #dcdfea;border-radius:8px;color:#5547e9;background:#fff;font-weight:650;text-decoration:none;cursor:pointer}.actions .primary{color:#fff;background:linear-gradient(100deg,#5138ee,#684df8)}.actions .danger{color:#c74458}.summary{display:grid;grid-template-columns:repeat(2,minmax(0,220px));gap:8px;margin-top:14px}.summary span{border:1px solid #e8eaf1;border-radius:8px}.card code{display:block;margin-top:11px;padding:11px;border-radius:8px;background:#f7f8fc}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}.create{min-height:120px;border:1px dashed #afa6ff;border-radius:14px;color:#5140ee;background:#ffffff99;display:grid;place-content:center;text-align:center;gap:7px;cursor:pointer}.create b{font-size:17px}.create small{color:#78839b}.create-tabs{display:grid;grid-template-columns:repeat(3,1fr);max-width:880px;margin-top:18px;border:1px solid #dfe2ec;border-radius:11px;overflow:hidden}.create-tabs button{height:50px;border:0;border-right:1px solid #e5e7ee;color:#5b657e;background:#fff;font-weight:700;cursor:pointer}.create-tabs button.active{color:#4e3df0;background:#fbfaff;box-shadow:inset 0 0 0 1px #bcb5ff}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;margin-top:18px}.formcol,.aside{display:grid;gap:13px;align-content:start}.section,.aside section{padding:18px 20px;border:1px solid #e3e6ef;border-radius:13px;background:#fff}.section h2,.aside h2{margin:0 0 15px;font-size:16px}.section h2 i{display:inline-grid;width:23px;height:23px;margin-right:8px;place-items:center;border-radius:50%;color:#fff;background:#5846f3;font-size:11px;font-style:normal}.field{display:grid;grid-template-columns:125px 1fr;gap:12px;align-items:start;margin-top:11px;font-size:13px;font-weight:650}.field>span{padding-top:11px}.field em{color:#e34a61;font-style:normal}.field input,.field textarea,.field select{width:100%;min-height:42px;padding:10px 12px;border:1px solid #dce0ea;border-radius:8px;color:#26314b;background:#fff;font:inherit;font-weight:500}.field textarea{min-height:70px;resize:vertical}.field textarea.code{min-height:115px;font-family:Consolas,monospace}.choices,.catalog{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:230px;overflow:auto}.choices button,.catalog button{padding:9px;border:1px solid #e2e4ed;border-radius:8px;color:#29344e;background:#fff;text-align:left;cursor:pointer}.choices button.selected,.catalog button.selected{border-color:#9d92ff;background:#f6f4ff}.choices small,.catalog small{display:block;margin-top:4px;color:#77819a}.modulegrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}.modulegrid .field{grid-template-columns:1fr}.modulegrid .field>span{padding-top:0}.notice{padding:10px 12px;border-radius:8px;color:#6b5a2c;background:#fff7e7;font-size:12px;line-height:1.55}.formactions{display:flex;justify-content:flex-end;gap:10px}.formactions button{min-width:145px;height:43px;border:1px solid #7767f5;border-radius:8px;color:#5141ed;background:#fff;font-weight:700;cursor:pointer}.formactions .primary{color:#fff;background:linear-gradient(105deg,#5039ed,#684df7)}.aside section div{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #e8eaf0}.aside section div:last-child{border:0}.aside strong{font-size:21px}.aside ul{padding-left:18px;color:#68738d;font-size:12px;line-height:1.7}.search{width:100%;height:40px;padding:0 12px;border:1px solid #dce0ea;border-radius:8px}.filters{display:flex;gap:8px;margin:9px 0}.filters button{padding:7px 14px;border:1px solid #e0e3ec;border-radius:7px;background:#fff;cursor:pointer}.filters button.active{color:#503eef;border-color:#9e93ff;background:#f5f3ff}.catalog button span{display:flex;justify-content:space-between}.catalog code{display:block;margin-top:5px;color:#7b859b;font-size:10px}.selectedtags{display:flex;flex-wrap:wrap;gap:8px}.selectedtags button{padding:7px 10px;border:1px solid #dcd9ff;border-radius:7px;color:#5040e9;background:#f7f5ff;cursor:pointer}.toast{position:fixed;right:26px;bottom:26px;max-width:440p const KEY='quantbuddy.workspace.phase1b.preview.v1';const models=['LightGBM（新手友好）','XGBoost','CatBoost','Linear','MLP','DNN','LSTM','GRU','ALSTM','TCN','Transformer','Localformer','TFT','TabNet','SFM','GATs','HIST','IGMTF','MASTER','TRA','DoubleEnsemble','ADD','AdaRNN'];const defaults=()=>({strategies:[{id:'base',name:'沪深300 LightGBM Top-5',status:'backtested',model:'LightGBM',factors:['Qlib Alpha158'],universe:'沪深300',rule:'Top-5',locked:true}],modules:[{id:'m-stock',name:'Top-5 选股模块',type:'stock_selection',builtin:true},{id:'m-weight',name:'等权分配模块',type:'weighting',builtin:true},{id:'m-rebalance',name:'每日调仓模块',type:'rebalance',builtin:true},{id:'m-risk',name:'市场趋势降仓模块',type:'risk_control',builtin:true}],factors:[{id:'f20',name:'20日动量',type:'动量因子',formula:'$close / Ref($close, 20) - 1',builtin:true},{id:'f60',name:'60日动量',type:'动量因子',formula:'$close / Ref($close, 60) - 1',builtin:true},{id:'fvol',name:'成交量变化率',type:'成交量因子',formula:'$volume / Ref($volume, 5) - 1',builtin:true},{id:'fbias',name:'均线偏离度',type:'技术因子',formula:'$close / MA($close, 20) - 1',builtin:true},{id:'fturn',name:'换手率',type:'成交量因子',formula:'$turnover / Ref($cap, 1)',builtin:true}],sets:[{id:'alpha158',name:'Qlib Alpha158',factorIds:[],count:158,builtin:true}]});let data=load(),activeTab='complete',sourceFilter='all';function load(){try{return JSON.parse(localStorage.getItem(KEY))||defaults()}catch{return defaults()}}function persist(){localStorage.setItem(KEY,JSON.stringify(data))}function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function id(p){return p+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,6)}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>e.classList.remove('show'),2600)}function counts(){return{complete:data.strategies.length,module:data.modules.length,factor:data.factors.length+data.sets.length}}function goto(hash){location.hash=hash}function pageHeader(title,sub,back=false){return`<div class="heading">${back?'<button data-go="workspace" aria-label="返回我的策略">←</button>':''}<div><h1>${title}</h1><p>${sub}</p></div></div>`}function tabs(active){return`<nav class="create-tabs"><button data-go="create-complete" class="${active==='complete'?'active':''}">▱　完整策略</button><button data-go="create-module" class="${active==='module'?'active':''}">◇　策略模块</button><button data-go="create-factor" class="${active==='factor'?'active':''}">▥　因子与因子集</button></nav>`}function aside(){const c=counts();return`<aside class="aside"><section><h2>你的工作区资源</h2><div><span>因子与因子集</span><strong>${c.factor}</strong></div><div><span>策略模块</span><strong>${c.module}</strong></div><div><span>完整策略</span><strong>${c.complete}</strong></div></section><section><h2>💡 创建提示</h2><ul><li>创建资产后会回到我的策略。</li><li>顶部数量与资产列表立即更新。</li><li>刷新此 HTML 后数据仍会保留。</li></ul></section></aside>`}function workspace(){const c=counts();const cards=activeTab==='complete'?strategyCards():activeTab==='module'?moduleCards():factorCards();return pageHeader('我的策略','管理你的完整策略、策略模块与因子资产')+`<section class="stats"><button class="stat ${activeTab==='complete'?'active':''}" data-tab="complete"><span class="si purple">▱</span><span><small>完整策略</small><strong>${c.complete}</strong></span></button><button class="stat ${activeTab==='module'?'active':''}" data-tab="module"><span class="si orange">◇</span><span><small>策略模块</small><strong>${c.module}</strong></span></button><button class="stat ${activeTab==='factor'?'active':''}" data-tab="factor"><span class="si green">✓</span><span><small>因子与因子集</small><strong>${c.factor}</strong></span></button></section><nav class="tabs"><button class="${activeTab==='complete'?'active':''}" data-tab="complete">▱　完整策略</button><button class="${activeTab==='module'?'active':''}" data-tab="module">◇　策略模块</button><button class="${activeTab==='factor'?'active':''}" data-tab="factor">▥　因子与因子集</button></nav><section class="list">${cards}</section>`}function strategyCards(){return data.strategies.map(s=>`<article class="card"><header><span class="icon">↗</span><div><h2>${esc(s.name)}</h2><p>${s.locked?'当前真实 Demo 策略':'我的完整策略'}</p></div><span class="badge ${s.status==='draft'?'draft':''}">${s.status==='backtested'?'已回测':'草稿'}</span></header><div class="grid4"><span><small>模型</small><strong>${esc(s.model)}</strong></span><span><small>因子 / 特征集</small><strong>${esc(s.factors.join(' + '))}</strong></span><span><small>股票池</small><strong>${esc(s.universe)}</strong></span><span><small>组合规则</small><strong>${esc(s.rule||'--')}</strong></span></div><div class="actions">${s.status==='backtested'?'<button>查看回测</button>':''}${!s.locked?`<button class="danger" data-delete="strategy" data-id="${s.id}">删除</button>`:''}</div></article>`).join('')+`<button class="create" data-go="create-complete"><b>＋　创建一个完整策略</b><small>从因子、因子集、模型和策略模块组装策略</small></button>`}function moduleCards(){return data.modules.map(m=>`<article class="card"><header><span class="icon" style="background:linear-gradient(145deg,#ff9c38,#ed7813)">◇</span><div><h2>${esc(m.name)}</h2><p>${m.builtin?'平台默认模块':'我的策略模块'}</p></div><span class="badge ${m.status==='draft'?'draft':''}">${m.status==='draft'?'草稿':'可使用'}</span></header><div class="summary"><span><small>模块类型</small><strong>${esc(typeLabel(m.type))}</strong></span><span><small>适用阶段</small><strong>${esc(stage(m.type))}</strong></span></div>${m.rule?`<code>${esc(m.rule)}</code>`:''}<div class="actions">${!m.builtin?`<button class="danger" data-delete="module" data-id="${m.id}">删除</button>`:''}</div></article>`).join('')+`<button class="create" data-go="create-module"><b>＋　创建一个策略模块</b><small>创建可复用的选股、权重、调仓或风控规则</small></button>`}function factorCards(){return`<div class="pair">`+data.sets.map(s=>`<article class="card"><header><span class="icon">▦</span><div><h2>${esc(s.name)}</h2><p>${s.builtin?'平台内置因子集':'我的因子集'}</p></div><span class="badge">因子集 · ${s.count??s.factorIds.length} 个</span></header><div class="actions">${!s.builtin?`<button class="danger" data-delete="set" data-id="${s.id}">删除</button>`:''}</div></article>`).join('')+data.factors.map(f=>`<article class="card"><header><span class="icon" style="background:linear-gradient(145deg,#35bf6b,#159a4b)">✦</span><div><h2>${esc(f.name)}</h2><p>${f.builtin?'平台内置示例':'我的因子'}</p></div><span class="badge ${f.status==='draft'?'draft':''}">${f.status==='draft'?'草稿':'单个因子'}</span></header><div class="summary"><span><small>因子类型</small><strong>${esc(f.type)}</strong></span><span><small>验证状态</small><strong>未验证</strong></span></div><code>${esc(f.formula)}</code><div class="actions">${!f.builtin?`<button class="danger" data-delete="factor" data-id="${f.id}">删除</button>`:''}</div></article>`).join('')+`</div><div class="pair"><button class="create" data-go="create-factor"><b>＋　创建一个因子</b><small>直接编写可计算公式</small></button><button class="create" data-go="create-set"><b>＋　创建一个因子集</b><small>组合至少两个单个因子</small></button></div>`}function formLayout(body){return`<div class="layout"><div class="formcol">${body}</div>${aside()}</div>`}function createComplete(){const factorOptions=[...data.sets.map(s=>({id:s.id,name:s.name,kind:s.builtin?'因子集 · 平台内置':'因子集'})),...data.factors.map(f=>({id:f.id,name:f.name,kind:f.builtin?'单个因子 · 平台内置':'单个因子'}))];const options=factorOptions.map((f,i)=>`<button type="button" class="${i===0?'selected':''}" data-pick-factor="${f.id}"><b>${esc(f.name)}</b><small>${f.kind}</small></button>`).join('');const modelOptions=models.map((m,i)=>`<option value="${i}">${m}${i?' · 仅可保存草稿':''}</option>`).join('');const moduleSelect=(type)=>`<select id="cm-${type}">${data.modules.filter(m=>m.type===type).map(m=>`<option value="${m.id}">${esc(m.name)}${m.builtin?'（平台默认）':''}</option>`).join('')}</select>`;return pageHeader('创建完整策略','从你的因子、因子集和策略模块中组装一个可回测的完整策略',true)+tabs('complete')+formLayout(`<section class="section"><h2><i>1</i>基础信息</h2><label class="field"><span>策略名称 <em>*</em></span><input id="cs-name" placeholder="例如：我的沪深300成长策略"></label><label class="field"><span>一句话说明</span><textarea id="cs-desc" maxlength="100"></textarea></label></section><section class="section"><h2><i>2</i>核心配置</h2><label class="field"><span>股票池 <em>*</em></span><select disabled><option>沪深300</option></select></label><div class="field"><span>因子 / 因子集 <em>*</em></span><div class="choices" id="completeFactors">${options}</div></div><label class="field"><span>预测模型 <em>*</em></span><select id="cs-model">${modelOptions}</select></label><p class="notice" id="modelNotice">当前只有 LightGBM + Qlib Alpha158 基线支持复用真实 Demo 回测。</p></section><section class="section"><h2><i>3</i>策略模块配置</h2><div class="modulegrid"><label class="field"><span>选股模块</span>${moduleSelect('stock_selection')}</label><label class="field"><span>权重分配模块</span>${moduleSelect('weighting')}</label><label class="field"><span>调仓模块</span>${moduleSelect('rebalance')}</label><label class="field"><span>风险控制模块</span>${moduleSelect('risk_control')}</label></div></section><div class="formactions"><button data-save="strategy-draft">保存草稿</button><button class="primary" data-save="strategy-backtest">运行回测</button></div>`)}function createModule(){return pageHeader('创建策略模块','编写一个可复用的策略模块，之后可加入完整策略中使用',true)+tabs('module')+formLayout(`<section class="section"><h2><i>1</i>基础信息</h2><label class="field"><span>模块名称 <em>*</em></span><input id="mod-name" placeholder="例如：市场趋势降仓模块"></label><label class="field"><span>一句话说明</span><textarea id="mod-summary" maxlength="100"></textarea></label></section><section class="section"><h2><i>2</i>模块配置</h2><label class="field"><span>模块类型 <em>*</em></span><select id="mod-type">${['stock_selection','weighting','rebalance','risk_control','cash_management','execution'].map(t=>`<option value="${t}">${typeLabel(t)}</option>`).join('')}</select></label><p class="notice" id="stageNotice">适用阶段由系统自动推导：stock_selection_stage</p><label class="field"><span>模块规则 <em>*</em></span><textarea class="code" id="mod-rule" placeholder="If(IndexClose < MA(IndexClose, 120), PortfolioWeight * 0.5, PortfolioWeight)"></textarea></label><label class="field"><span>详细说明</span><textarea id="mod-desc"></textarea></label></section><div class="formactions"><button data-save="module-draft">保存草稿</button><button class="primary" data-save="module-ready">保存到我的策略模块</button></div>`)}function createFactor(){return pageHeader('创建因子','编写一个可计算的因子公式，之后可加入完整策略或组合成因子集',true)+tabs('factor')+formLayout(`<section class="section"><h2><i>1</i>基础信息</h2><label class="field"><span>因子名称 <em>*</em></span><input id="fac-name" placeholder="例如：过去20日波动率"></label><label class="field"><span>因子类型 <em>*</em></span><select id="fac-type">${['动量因子','波动率因子','成交量因子','价格因子','技术因子','复合因子','其他'].map(t=>`<option>${t}</option>`).join('')}</select></label></section><section class="section"><h2><i>2</i>因子公式</h2><label class="field"><span>因子公式 <em>*</em></span><textarea class="code" id="fac-formula" placeholder="Std($close / Ref($close, 1) - 1, 20)"></textarea></label><p class="notice">公式仅保存为文本，不会执行任意 Python 或 JavaScript。</p></section><section class="section"><h2><i>3</i>详细说明</h2><label class="field"><span>详细说明</span><textarea id="fac-desc"></textarea></label></section><div class="formactions"><button data-save="factor-draft">保存草稿</button><button class="primary" data-save="factor-ready">保存到我的因子</button></div>`)}function createSet(){const catalog=data.factors.filter(f=>sourceFilter==='all'||(sourceFilter==='mine'?!f.builtin:f.builtin)).map(f=>`<button type="button" data-pick-set="${f.id}"><span><b>${esc(f.name)}</b><small>${esc(f.type)}</small></span><code>${esc(f.formula)}</code></button>`).join('');return pageHeader('创建因子集','将多个单个因子组合成一个可重复使用的命名集合',true)+tabs('factor')+formLayout(`<section class="section"><h2><i>A</i>基础信息</h2><label class="field"><span>因子集名称 <em>*</em></span><input id="set-name" placeholder="例如：我的量价因子集 v1"></label><label class="field"><span>一句话说明</span><input id="set-desc" maxlength="100"></label></section><section class="section"><h2><i>B</i>选择因子</h2><input class="search" id="factorSearch" placeholder="搜索因子名称或公式关键词"><div class="filters"><button data-source="all" class="${sourceFilter==='all'?'active':''}">全部</button><button data-source="mine" class="${sourceFilter==='mine'?'active':''}">我的因子</button><button data-source="builtin" class="${sourceFilter==='builtin'?'active':''}">平台内置</button></div><div class="catalog" id="setCatalog">${catalog}</div></section><section class="section"><h2><i>C</i>已选因子 <small id="selCount">已选择 0 个</small></h2><div class="selectedtags" id="selectedTags"></div></section><div class="formactions"><button data-save="set-draft">保存草稿</button><button class="primary" data-save="set-ready">保存因子集</button></div>`)}function typeLabel(t){return{stock_selection:'选股模块',weighting:'权重分配模块',rebalance:'调仓模块',risk_control:'风险控制模块',cash_management:'现金管理模块',execution:'交易执行模块'}[t]||t}function stage(t){return{stock_selection:'stock_selection_stage',weighting:'portfolio_construction_stage',rebalance:'rebalance_stage',risk_control:'risk_control_stage',cash_management:'portfolio_construction_stage',execution:'trade_execution_stage'}[t]||''}let completeSelected=['alpha158'],setSelected=[];function render(){const hash=(location.hash||'#workspace').slice(1);const app=document.getElementById('app');app.innerHTML=hash==='workspace'?workspace():hash==='create-complete'?createComplete():hash==='create-module'?createModule():hash==='create-factor'?createFactor():hash==='create-set'?createSet():workspace();bind()}function bind(){document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>goto(e.dataset.go));document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{activeTab=e.dataset.tab;render()});document.querySelectorAll('[data-delete]').forEach(e=>e.onclick=()=>del(e.dataset.delete,e.dataset.id));document.querySelectorAll('[data-pick-factor]').forEach(e=>e.onclick=()=>{const x=e.dataset.pickFactor;completeSelected=completeSelected.includes(x)?completeSelected.filter(v=>v!==x):[...completeSelected,x];e.classList.toggle('selected')});document.querySelectorAll('[data-pick-set]').forEach(e=>e.onclick=()=>{const x=e.dataset.pickSet;setSelected=setSelected.includes(x)?setSelected.filter(v=>v!==x):[...setSelected,x];e.classList.toggle('selected');updateSelected()});document.querySelectorAll('[data-source]').forEach(e=>e.onclick=()=>{sourceFilter=e.dataset.source;render()});document.querySelectorAll('[data-save]').forEach(e=>e.onclick=()=>save(e.dataset.save));const mt=document.getElementById('mod-type');if(mt)mt.onchange=()=>document.getElementById('stageNotice').textContent='适用阶段由系统自动推导：'+stage(mt.value);const search=document.getElementById('factorSearch');if(search)search.oninput=()=>document.querySelectorAll('#setCatalog button').forEach(b=>b.hidden=!b.innerText.toLowerCase().includes(search.value.toLowerCase()))}function updateSelected(){const box=document.getElementById('selectedTags'),count=document.getElementById('selCount');if(!box)return;box.innerHTML=setSelected.map(x=>{const f=data.factors.find(v=>v.id===x);return f?`<button data-remove-selected="${x}">${esc(f.name)} ×</button>`:''}).join('');count.textContent=`已选择 ${setSelected.length} 个`;box.querySelectorAll('button').forEach(b=>b.onclick=()=>{setSelected=setSelected.filter(v=>v!==b.dataset.removeSelected);render()})}function val(x){return document.getElementById(x)?.value.trim()||''}function save(kind){if(kind.startsWith('strategy')){const name=val('cs-name');if(!name||!completeSelected.length)return toast('请填写策略名称并至少选择一个因子或因子集');const mi=+document.getElementById('cs-model').value;const baseline=mi===0&&completeSelected.includes('alpha158')&&val('cm-stock_selection')==='m-stock'&&val('cm-weighting')==='m-weight'&&val('cm-rebalance')==='m-rebalance'&&val('cm-risk_control')==='m-risk';const requested=kind==='strategy-backtest';const status=requested&&baseline?'backtested':'draft';data.strategies.push({id:id('s'),name,status,model:models[mi].replace(/（.*$/,''),factors:completeSelected.map(x=>(data.sets.find(v=>v.id===x)||data.factors.find(v=>v.id===x))?.name||x),universe:'沪深300',rule:data.modules.find(v=>v.id===val('cm-stock_selection'))?.name||'--'});persist();if(requested&&!baseline)toast('当前 Demo 仅支持 LightGBM + Qlib Alpha158 基线真实回测；该配置已保存为草稿');activeTab='complete';setTimeout(()=>goto('workspace'),requested&&!baseline?1400:0);return}if(kind.startsWith('module')){if(!val('mod-name')||!val('mod-rule'))return toast('请填写模块名称和模块规则');data.modules.push({id:id('m'),name:val('mod-name'),type:val('mod-type'),rule:val('mod-rule'),summary:val('mod-summary'),status:kind.endsWith('draft')?'draft':'ready'});persist();activeTab='module';goto('workspace');return}if(kind.startsWith('factor-')){if(!val('fac-name')||!val('fac-formula'))return toast('请填写因子名称和因子公式');data.factors.push({id:id('f'),name:val('fac-name'),type:val('fac-type'),formula:val('fac-formula'),status:kind.endsWith('draft')?'draft':'ready'});persist();activeTab='factor';goto('workspace');return}if(kind.startsWith('set-')){if(!val('set-name'))return toast('请填写因子集名称');if(kind==='set-ready'&&setSelected.length<2)return toast('因子集至少选择两个单个因子');data.sets.push({id:id('fs'),name:val('set-name'),factorIds:[...new Set(setSelected)],count:new Set(setSelected).size,status:kind.endsWith('draft')?'draft':'ready'});persist();activeTab='factor';goto('workspace')}}function del(kind,itemId){if(!confirm('确认删除该资产？'))return;if(kind==='strategy')data.strategies=data.strategies.filter(x=>x.id!==itemId);if(kind==='module')data.modules=data.modules.filter(x=>x.id!==itemId);if(kind==='factor')data.factors=data.factors.filter(x=>x.id!==itemId);if(kind==='set')data.sets=data.sets.filter(x=>x.id!==itemId);persist();render();toast('资产已删除，数量已更新')}window.addEventListener('hashchange',render);document.getElementById('resetBtn').onclick=()=>{if(confirm('重置所有 Phase 1B 预览数据？')){localStorage.removeItem(KEY);data=defaults();activeTab='complete';goto('workspace');render();toast('预览数据已重置')}};render();
</script></body></html>
