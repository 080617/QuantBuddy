<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QuantBuddy · Bilingual Prototype</title>
  <script>
    const qbRequestedRoute=new URLSearchParams(location.search).get("route");
    if(qbRequestedRoute&&!location.hash)history.replaceState(null,"",`${location.pathname}${location.search}#${qbRequestedRoute}`);

  <style>
    html,body{min-width:320px;min-height:100%;margin:0}body{background:#f6f7fc}#qb-host,qb-source-view{display:block;min-height:100vh}
    .qb-host-placeholder{display:grid;min-height:100vh;place-items:center;padding:24px;background:#f6f7fc;color:#17213a;font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;text-align:center}.qb-host-placeholder>section{width:min(520px,100%);padding:42px 28px;border:1px solid #e4e6ef;border-radius:16px;background:#fff;box-shadow:0 18px 55px rgba(58,65,105,.08)}.qb-host-placeholder h1{margin:0;font-size:28px}.qb-host-placeholder p{margin:12px 0 22px;color:#77829a}.qb-host-placeholder button{min-height:40px;padding:0 18px;border:1px solid #c9c2ff;border-radius:9px;color:#5845ef;background:#fff;cursor:pointer;font-weight:700}
  </style>
</head>
<body>
  <main id="qb-host" aria-live="polite"></main>
  <script id="qb-community-final-integration">
  (() => {
    "use strict";
    const APP_KEY="quantbuddy.community-final.v1";
    const SOURCE_PREFIX="quantbuddy.community-final.source.";
    const LEGACY_APP_KEYS=["quantbuddy.community-refined.v1","quantbuddy.final-integrated.v1"];
    const LEGACY_SOURCE_PREFIXES=["quantbuddy.community-refined.source.","quantbuddy.final-integrated.source."];
    const CURRENT_AUTHOR_ID="author-anna-zhang";
    const WORKSPACE_KEY=SOURCE_PREFIX+"workspace.quantbuddy.workspace.phase1b.preview.v1";
    const COMMUNITY_KEY=SOURCE_PREFIX+"community.quantbuddy.phase12.static";
    const seedIds=["post-complete-strategy-lightgbm","post-factor-volatility-20d","post-module-trend-risk-control","post-question-high-return-low-rankic"];
    const clone=value=>JSON.parse(JSON.stringify(value));
    const uid=prefix=>prefix+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7);
    const escapeHtml=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const workspaceDefaults=()=>({
      strategies:[{id:"base",name:"沪深300 LightGBM Top-5",status:"backtested",model:"LightGBM",factors:["Qlib Alpha158"],universe:"沪深300",rule:"Top-5",locked:true,origin:"builtin"}],
      modules:[
        {id:"m-stock",name:"Top-5 选股模块",type:"stock_selection",builtin:true},
        {id:"m-weight",name:"等权分配模块",type:"weighting",builtin:true},
        {id:"m-rebalance",name:"每日调仓模块",type:"rebalance",builtin:true},
        {id:"m-risk",name:"市场趋势降仓模块",type:"risk_control",builtin:true}
      ],
      factors:[
        {id:"f20",name:"20日动量",type:"动量因子",formula:"$close / Ref($close, 20) - 1",builtin:true},
        {id:"f60",name:"60日动量",type:"动量因子",formula:"$close / Ref($close, 60) - 1",builtin:true},
        {id:"fvol",name:"成交量变化率",type:"成交量因子",formula:"$volume / Ref($volume, 5) - 1",builtin:true},
        {id:"fbias",name:"均线偏离度",type:"技术因子",formula:"$close / MA($close, 20) - 1",builtin:true},
        {id:"fturn",name:"换手率",type:"成交量因子",formula:"$turnover / Ref($cap, 1)",builtin:true}
      ],
      sets:[{id:"alpha158",name:"Qlib Alpha158",factorIds:[],count:158,builtin:true}]
    });
    const stateDefaults=()=>({version:3,posts:[],comments:{},followedAuthors:[],communityFilter:"all",communitySort:"recommended",pendingEdit:null,pendingPublish:null,workspaceTab:null,backtestStrategyId:"base",migrated:false});
    function loadState(){
      try{
        const current=localStorage.getItem(APP_KEY),legacy=!current&&LEGACY_APP_KEYS.map(key=>localStorage.getItem(key)).find(Boolean),state=Object.assign(stateDefaults(),JSON.parse(current||legacy||"{}"),{version:3});
        state.followedAuthors=(state.followedAuthors||[]).filter(id=>id!==CURRENT_AUTHOR_ID);
        if(!["recommended","latest","most_starred","most_commented","most_copied"].includes(state.communitySort))state.communitySort="recommended";
        return state
      }
      catch{return stateDefaults()}
    }
    let appState=loadState();
    function saveState(){localStorage.setItem(APP_KEY,JSON.stringify(appState))}
    function readWorkspace(){
      try{return Object.assign(workspaceDefaults(),JSON.parse(localStorage.getItem(WORKSPACE_KEY)||"{}"))}
      catch{return workspaceDefaults()}
    }
    function writeWorkspace(data){localStorage.setItem(WORKSPACE_KEY,JSON.stringify(data))}
    function readCommunityState(){
      try{return JSON.parse(localStorage.getItem(COMMUNITY_KEY)||"{}")}
      catch{return{}}
    }
    function writeCommunityState(value){localStorage.setItem(COMMUNITY_KEY,JSON.stringify(value))}
    function findById(list,id){return(list||[]).find(item=>item.id===id)}
    function moduleType(value){
      const map={"风险控制模块":"risk_control","选股模块":"stock_selection","权重分配模块":"weighting","调仓模块":"rebalance","现金管理模块":"cash_management","交易执行模块":"execution"};
      return map[value]||value||"risk_control";
    }
    function migrateExistingState(){
      if(localStorage.getItem(WORKSPACE_KEY)){appState.migrated=true;saveState();return}
      const legacyPrefix=LEGACY_SOURCE_PREFIXES.find(prefix=>localStorage.getItem(prefix+"workspace.quantbuddy.workspace.phase1b.preview.v1")),legacyWorkspace=legacyPrefix&&localStorage.getItem(legacyPrefix+"workspace.quantbuddy.workspace.phase1b.preview.v1");
      if(legacyWorkspace){
        localStorage.setItem(WORKSPACE_KEY,legacyWorkspace);
        const legacyCommunity=localStorage.getItem(legacyPrefix+"community.quantbuddy.phase12.static");
        if(legacyCommunity)localStorage.setItem(COMMUNITY_KEY,legacyCommunity);
        appState.migrated=true;saveState();return;
      }
      const workspace=workspaceDefaults();
      let old=null;
      try{old=JSON.parse(localStorage.getItem("quantbuddy.unified-product.v2")||localStorage.getItem("quantbuddy.unified-product.v1")||"null")}catch{}
      if(old){
        (old.userStrategies||[]).forEach(item=>workspace.strategies.push({
          id:item.id||uid("s"),name:item.name||"未命名策略",status:item.backtest?"backtested":"draft",model:item.model||"LightGBM",
          factors:[item.factorSet||"Qlib Alpha158"],universe:item.universe||"沪深300",rule:item.rule||"Top-5",locked:false,
          origin:item.origin||"owned",sourcePostId:item.sourcePostId,sourceAuthor:item.sourceAuthor
        }));
        (old.userModules||[]).forEach(item=>workspace.modules.push({
          id:item.id||uid("m"),name:item.name||"未命名模块",type:moduleType(item.type),rule:item.rule||"",summary:item.summary||"",
          status:"ready",builtin:false,origin:item.origin||"owned",sourcePostId:item.sourcePostId,sourceAuthor:item.sourceAuthor
        }));
        (old.userFactors||[]).forEach(item=>workspace.factors.push({
          id:item.id||uid("f"),name:item.name||"未命名因子",type:item.type||"其他",formula:item.formula||item.expression||"",
          status:"ready",builtin:false,origin:item.origin||"owned",sourcePostId:item.sourcePostId,sourceAuthor:item.sourceAuthor
        }));
        (old.factorSets||[]).forEach(item=>workspace.sets.push({
          id:item.id||uid("fs"),name:item.name||"未命名因子集",factorIds:item.factorIds||[],count:(item.factorIds||[]).length,
          status:"ready",builtin:false
        }));
        appState.posts=(old.localPosts||[]).map(item=>({
          id:item.id||uid("post"),type:item.type||"question",title:item.title||"本地发布内容",summary:item.summary||"",
          description:item.description||"",author:"Anna Zhang",createdAt:"本地发布"
        }));
        appState.comments=old.comments||{};
        const community={};
        const idMap={"post-strategy-lightgbm":"post-complete-strategy-lightgbm","post-factor-vol20":"post-factor-volatility-20d","post-module-risk":"post-module-trend-risk-control"};
        (old.stars||[]).forEach(id=>{const key=idMap[id]||id;community[key]=community[key]||{};community[key].star=true});
        (old.forkedPosts||[]).concat(old.savedFactorPosts||[],old.savedModulePosts||[]).forEach(id=>{const key=idMap[id]||id;community[key]=community[key]||{};community[key].fork=true});
        writeCommunityState(community);
      }
      writeWorkspace(workspace);
      appState.migrated=true;
      saveState();
    }
    migrateExistingState();

    function sourcePost(id){
      const seeds={
        "post-complete-strategy-lightgbm":{id:"post-complete-strategy-lightgbm",type:"strategy",title:"沪深300 LightGBM Top-5：一次面向初学者的 Qlib 实验",summary:"用真实 Qlib Demo 回测快照理解一个完整量化策略。",author:"Anna Zhang",authorId:"author-anna-zhang",createdAt:"2026-07-31T09:00:00.000Z",baseStars:36,baseComments:0,baseForks:8,hasBacktest:true,config:{model:"LightGBM",factorSet:"Qlib Alpha158",universe:"沪深300",rule:"TopkDropoutStrategy · Top-5"}},
        "post-factor-volatility-20d":{id:"post-factor-volatility-20d",type:"factor",title:"过去20日波动率",summary:"衡量股票过去20个交易日收益率的波动程度。",author:"Anna Zhang",authorId:"author-anna-zhang",createdAt:"2026-07-30T10:00:00.000Z",baseStars:18,baseComments:0,baseForks:5,factorType:"波动率因子",formula:"Std($close / Ref($close, 1) - 1, 20)"},
        "post-module-trend-risk-control":{id:"post-module-trend-risk-control",type:"module",title:"市场趋势降仓模块",summary:"在市场趋势走弱时主动降低仓位，帮助控制组合回撤。",author:"Anna Zhang",authorId:"author-anna-zhang",createdAt:"2026-07-29T11:00:00.000Z",baseStars:12,baseComments:0,baseForks:3,moduleType:"risk_control",moduleTypeLabel:"风险控制模块",rule:"If(IndexClose < MA(IndexClose, 120), PortfolioWeight * 0.5, PortfolioWeight)"},
        "post-question-high-return-low-rankic":{id:"post-question-high-return-low-rankic",type:"question",title:"为什么我的策略收益很高，但 Rank IC 很低？",summary:"组合收益较高是否一定意味着模型排序能力很强？应该如何一起理解收益、IC 与 Rank IC？",author:"Anna Zhang",authorId:"author-anna-zhang",createdAt:"2026-07-28T12:00:00.000Z",baseStars:9,baseComments:1,baseForks:0}
      };
      const post=seeds[id]||(appState.posts||[]).find(item=>item.id===id);
      if(!post)return null;
      const normalizedType={complete_strategy:"strategy",strategy_module:"module"}[post.type]||post.type;
      return Object.assign({author:"Anna Zhang",authorId:"author-anna-zhang",baseStars:0,baseComments:0,baseForks:0,createdAt:new Date(0).toISOString()},post,{type:normalizedType});
    }
    function syncCommunityFork(postId,type,on){
      if(type==="question")return;
      const post=sourcePost(postId);
      if(!post)return;
      const data=readWorkspace();
      if(on){
        if(type==="strategy"&&!data.strategies.some(item=>item.sourcePostId===postId)){
          const config=post.config||{};
          data.strategies.push({id:uid("s"),name:(post.title||"社区策略")+" Fork",status:"draft",model:config.model||"LightGBM",factors:[config.factorSet||"Qlib Alpha158"],universe:config.universe||"沪深300",rule:config.rule||"Top-5",locked:false,origin:"community_fork",sourcePostId:postId,sourceAuthor:post.author||"Anna Zhang"});
        }
        if(type==="factor"&&!data.factors.some(item=>item.sourcePostId===postId)){
          data.factors.push({id:uid("f"),name:post.title||"社区因子",type:post.factorType||"其他",formula:post.formula||"",status:"ready",builtin:false,origin:"community_fork",sourcePostId:postId,sourceAuthor:post.author||"Anna Zhang"});
        }
        if(type==="module"&&!data.modules.some(item=>item.sourcePostId===postId)){
          data.modules.push({id:uid("m"),name:post.title||"社区模块",type:post.moduleType||"risk_control",rule:post.rule||"",summary:post.summary||"",status:"ready",builtin:false,origin:"community_fork",sourcePostId:postId,sourceAuthor:post.author||"Anna Zhang"});
        }
      }else{
        if(type==="strategy")data.strategies=data.strategies.filter(item=>item.sourcePostId!==postId);
        if(type==="factor")data.factors=data.factors.filter(item=>item.sourcePostId!==postId);
        if(type==="module")data.modules=data.modules.filter(item=>item.sourcePostId!==postId);
      }
      writeWorkspace(data);
    }
    function updateCommunityForkState(postId,on){
      if(!postId)return;
      const community=readCommunityState();
      community[postId]=community[postId]||{};
      community[postId].fork=on;
      writeCommunityState(community);
    }
    function addOriginalButton(container,label,action,key){
      if(!container||container.querySelector('[data-qb-action="'+action+'"]'))return;
      const button=document.createElement("button");
      button.type="button";button.textContent=label;button.dataset.qbAction=action;button.dataset.qbId=key;
      button.addEventListener("click",event=>{event.preventDefault();event.stopPropagation();handleWorkspaceAction(action,key)});
      container.insertBefore(button,container.querySelector(".danger"));
    }
    function refreshCurrent(){window.QBFull?.render()}
    function handleWorkspaceAction(action,id){
      const data=readWorkspace();
      const type=action.split("-")[1];
      if(action.startsWith("publish-")){
        appState.pendingPublish={type,id};saveState();location.hash="#community/publish/"+type;return;
      }
      if(action.startsWith("duplicate-")){
        const bucket=type==="strategy"?"strategies":type==="factor"?"factors":"modules";
        const source=findById(data[bucket],id);if(!source)return;
        const copy=clone(source);copy.id=uid(type==="strategy"?"s":type==="factor"?"f":"m");copy.name=source.name+" 副本";copy.locked=false;copy.builtin=false;copy.status=type==="strategy"?"draft":"ready";copy.origin="owned";
        data[bucket].push(copy);writeWorkspace(data);appState.workspaceTab=type==="strategy"?"complete":type==="factor"?"factor":"module";saveState();refreshCurrent();return;
      }
      if(action.startsWith("edit-")){
        appState.pendingEdit={type,id};saveState();
        location.hash="#strategy/create/"+(type==="strategy"?"complete":type);
      }
    }
    function decorateWorkspace(shadow,route){
      if(route==="strategy"){
        if(appState.pendingEdit){appState.pendingEdit=null;saveState()}
        if(appState.workspaceTab&&!shadow.__qbTabRestored){
          shadow.__qbTabRestored=true;
          const wanted=appState.workspaceTab;appState.workspaceTab=null;saveState();
          const button=[...shadow.querySelectorAll(".tabs [data-tab]")].find(item=>item.dataset.tab===wanted);
          if(button){button.click();return}
        }
        const data=readWorkspace();
        const active=shadow.querySelector(".tabs button.active")?.dataset.tab||"complete";
        if(active==="complete"){
          [...shadow.querySelectorAll(".list>article.card")].forEach((card,index)=>{
            const item=data.strategies[index];if(!item)return;
            card.dataset.strategyId=item.id;
            if(item.sourcePostId){card.dataset.sourcePostId=item.sourcePostId;const text=card.querySelector("header p");if(text)text.textContent="来源："+(item.sourceAuthor||"Anna Zhang")+" · Community Fork · 可独立编辑"}
            const actions=card.querySelector(".actions");
            if(!item.locked)addOriginalButton(actions,"编辑","edit-strategy",item.id);
            addOriginalButton(actions,"复制","duplicate-strategy",item.id);
            if(item.status==="backtested")addOriginalButton(actions,"发布到社区","publish-strategy",item.id);
          });
        }else{
          [...shadow.querySelectorAll(".list article.card")].forEach((card,index)=>{
            const name=card.querySelector("h2")?.textContent?.trim();
            if(!name)return;
            if(active==="module"){
              const item=data.modules[index];if(!item)return;
              card.dataset.workspaceId=item.id;
              if(item.sourcePostId){card.dataset.sourcePostId=item.sourcePostId;const text=card.querySelector("header p");if(text)text.textContent="来源："+(item.sourceAuthor||"Anna Zhang")+" · Community Fork"}
              if(!item.builtin){addOriginalButton(card.querySelector(".actions"),"编辑","edit-module",item.id);addOriginalButton(card.querySelector(".actions"),"复制","duplicate-module",item.id);addOriginalButton(card.querySelector(".actions"),"发布到社区","publish-module",item.id)}
            }else{
              const factor=data.factors.find(value=>value.name===name);
              if(factor){card.dataset.workspaceId=factor.id;if(factor.sourcePostId){card.dataset.sourcePostId=factor.sourcePostId;const text=card.querySelector("header p");if(text)text.textContent="来源："+(factor.sourceAuthor||"Anna Zhang")+" · Community Fork"}if(!factor.builtin){addOriginalButton(card.querySelector(".actions"),"编辑","edit-factor",factor.id);addOriginalButton(card.querySelector(".actions"),"复制","duplicate-factor",factor.id);addOriginalButton(card.querySelector(".actions"),"发布到社区","publish-factor",factor.id)}}
            }
          });
        }
        if(!shadow.__qbDeleteSync){
          shadow.__qbDeleteSync=true;
          shadow.addEventListener("click",event=>{
            const button=event.target.closest("[data-delete]");if(!button)return;
            const card=button.closest(".card"),postId=card?.dataset.sourcePostId;
            if(postId)setTimeout(()=>{const dataNow=readWorkspace();const exists=[...dataNow.strategies,...dataNow.modules,...dataNow.factors].some(item=>item.sourcePostId===postId);if(!exists)updateCommunityForkState(postId,false)},0);
          });
        }
        return;
      }
      applyWorkspaceEdit(shadow,route);
    }
    function setControl(shadow,id,value){
      const element=shadow.getElementById(id);if(!element)return;
      element.value=value??"";element.dispatchEvent(new Event("change",{bubbles:true}));
    }
    function applyWorkspaceEdit(shadow,route){
      const pending=appState.pendingEdit;if(!pending||shadow.__qbEditPrepared)return;
      const expected=pending.type==="strategy"?"strategy/create/complete":"strategy/create/"+pending.type;
      if(route!==expected)return;
      const data=readWorkspace();
      const bucket=pending.type==="strategy"?"strategies":pending.type==="factor"?"factors":"modules";
      const item=findById(data[bucket],pending.id);if(!item)return;
      shadow.__qbEditPrepared=true;
      const heading=shadow.querySelector(".heading h1");if(heading)heading.textContent=pending.type==="strategy"?"编辑完整策略":pending.type==="factor"?"编辑因子":"编辑策略模块";
      if(pending.type==="strategy"){
        setControl(shadow,"cs-name",item.name);setControl(shadow,"cs-desc",item.description||"");
        const model=shadow.getElementById("cs-model");if(model){const option=[...model.options].find(value=>value.textContent.startsWith(item.model));if(option)model.value=option.value}
        shadow.querySelectorAll("#completeFactors [data-pick-factor]").forEach(button=>{const name=button.querySelector("b")?.textContent;button.classList.toggle("selected",(item.factors||[]).includes(name))});
        const stock=shadow.getElementById("cm-stock_selection");if(stock){const option=[...stock.options].find(value=>value.textContent.includes(item.rule||""));if(option)stock.value=option.value}
      }else if(pending.type==="factor"){
        setControl(shadow,"fac-name",item.name);setControl(shadow,"fac-type",item.type);setControl(shadow,"fac-formula",item.formula);setControl(shadow,"fac-desc",item.description||"");
      }else{
        setControl(shadow,"mod-name",item.name);setControl(shadow,"mod-type",item.type);setControl(shadow,"mod-rule",item.rule);setControl(shadow,"mod-summary",item.summary||"");setControl(shadow,"mod-desc",item.description||"");
      }
      shadow.querySelectorAll("[data-save]").forEach(button=>button.textContent=button.classList.contains("primary")?"保存修改":"保存修改");
      if(!shadow.__qbEditCapture){
        shadow.__qbEditCapture=true;
        shadow.addEventListener("click",event=>{
          const choice=event.target.closest("[data-pick-factor]");
          if(choice&&appState.pendingEdit?.type==="strategy"){event.preventDefault();event.stopImmediatePropagation();choice.classList.toggle("selected");return}
          const save=event.target.closest("[data-save]");if(!save||!appState.pendingEdit)return;
          event.preventDefault();event.stopImmediatePropagation();
          saveWorkspaceEdit(shadow,save.dataset.save);
        },true);
      }
    }
    function saveWorkspaceEdit(shadow,saveKind){
      const pending=appState.pendingEdit;if(!pending)return;
      const data=readWorkspace();
      const bucket=pending.type==="strategy"?"strategies":pending.type==="factor"?"factors":"modules";
      const item=findById(data[bucket],pending.id);if(!item)return;
      const value=id=>shadow.getElementById(id)?.value?.trim()||"";
      if(pending.type==="strategy"){
        const name=value("cs-name");const factors=[...shadow.querySelectorAll("#completeFactors [data-pick-factor].selected b")].map(node=>node.textContent.trim());
        if(!name||!factors.length){alert("请填写策略名称并至少选择一个因子或因子集");return}
        item.name=name;item.description=value("cs-desc");item.model=shadow.getElementById("cs-model")?.selectedOptions[0]?.textContent.replace(/（.*$/,"").replace(/ ·.*$/,"")||item.model;item.factors=factors;item.universe="沪深300";
        const stock=value("cm-stock_selection");item.rule=findById(data.modules,stock)?.name||item.rule;item.status=item.locked?"backtested":"draft";
      }else if(pending.type==="factor"){
        if(!value("fac-name")||!value("fac-formula")){alert("请填写因子名称和因子公式");return}
        item.name=value("fac-name");item.type=value("fac-type");item.formula=value("fac-formula");item.description=value("fac-desc");item.status=saveKind.endsWith("draft")?"draft":"ready";
      }else{
        if(!value("mod-name")||!value("mod-rule")){alert("请填写模块名称和模块规则");return}
        item.name=value("mod-name");item.type=value("mod-type");item.rule=value("mod-rule");item.summary=value("mod-summary");item.description=value("mod-desc");item.status=saveKind.endsWith("draft")?"draft":"ready";
      }
      writeWorkspace(data);appState.workspaceTab=pending.type==="strategy"?"complete":pending.type==="factor"?"factor":"module";appState.pendingEdit=null;saveState();location.hash="#strategy";
    }
    function communityStatus(postId){const community=readCommunityState();return community[postId]||{}}
    function communityCounts(post){
      const status=communityStatus(post.id),localComments=(appState.comments[post.id]||[]).length;
      return{stars:(post.baseStars||0)+(status.star?1:0),comments:(post.baseComments||0)+localComments,forks:(post.baseForks||0)+(status.fork?1:0),starred:!!status.star,forked:!!status.fork}
    }
    function communityActionLabel(post,counts){
      const english=window.QBLanguage?.get?.()==="en";

      set("name",item.name);
      if(kind==="factor"){set("type",item.type);set("formula",item.formula);set("description",item.description)}

      if(kind==="strategy"){set("summary",item.description||"来自我的策略工作区的完整策略");const config=shadow.querySelectorAll(".config strong");[item.universe||"沪深300",(item.factors||[]).join(" + "),item.model||"LightGBM",item.rule||"Top-5","每日调仓","基础回撤控制"].forEach((value,index)=>{if(config[index])config[index].textContent=value})}
    }
    function setupStrategyPublishPicker(shadow,form){
      const select=form.querySelector(".part .field select");if(!select||select.dataset.qbReady)return;
      select.dataset.qbReady="true";select.id="qb-publish-strategy";
      const strategies=readWorkspace().strategies.filter(item=>item.status==="backtested");
      select.replaceChildren(...strategies.map(item=>{const option=document.createElement("option");option.value=item.id;option.textContent=item.name;return option}));
      const pending=appState.pendingPublish?.type==="strategy"?appState.pendingPublish.id:"",selected=findById(strategies,pending)||strategies[0];
      if(!selected)return;
      select.value=selected.id;
      const apply=item=>{if(!item)return;appState.pendingPublish={type:"strategy",id:item.id};saveState();const title=shadow.getElementById("name"),summary=shadow.getElementById("summary"),previous=form.dataset.qbAutoTitle||"";if(title&&(!title.value.trim()||title.value===previous)){title.value=item.name;form.dataset.qbAutoTitle=item.name}if(summary&&!summary.value.trim())summary.value=item.description||"来自我的策略工作区的完整策略";const config=shadow.querySelectorAll(".config strong");[item.universe||"沪深300",(item.factors||[]).join(" + "),item.model||"LightGBM",item.rule||"Top-5","每日调仓","基础回撤控制"].forEach((value,index)=>{if(config[index])config[index].textContent=value})};

    function setupLibraryPublishPicker(shadow,form,kind){

    function decoratePublish(shadow,route){
      const kind=route.split("/").at(-1),form=shadow.querySelector("form.card");if(!form)return;
      shadow.querySelector(".preview-note")?.remove();
      prefillPublishAsset(shadow,kind,form);

      else setupLibraryPublishPicker(shadow,form,kind);

        shadow.__qbPublishCapture=true;
        shadow.addEventListener("submit",event=>{
          if(!event.target.matches("form.card"))return;
          const currentKind=(location.hash||"").split("/").at(-1),post=publishValues(shadow,currentKind);
          const valid=validPublish(post,currentKind),error=shadow.getElementById("error");
          if(!valid){event.preventDefault();event.stopImmediatePropagation();error?.classList.add("show");return}
          error?.classList.remove("show");
          if(currentKind==="question"){if(savePublishedPost(post))setTimeout(()=>{location.hash="#community"},250)}
          else shadow.__qbPendingPost=post;
        },true);
        shadow.addEventListener("click",event=>{
          const switchButton=event.target.closest(".switcher [data-kind]");
          if(switchButton&&switchButton.dataset.kind!==(location.hash||"").split("/").at(-1)){event.preventDefault();event.stopImmediatePropagation();location.hash="#community/publish/"+switchButton.dataset.kind;return}
          if(!event.target.closest(".modal .confirm"))return;
          if(shadow.__qbPendingPost){const post=shadow.__qbPendingPost;if(savePublishedPost(post))setTimeout(()=>{location.hash="#community"},250);shadow.__qbPendingPost=null}
        },true);
      }
    }
    function decorateBacktest(shadow){
      const localize=value=>window.QBLanguage?.get?.()==="en"?(window.QBLanguage.translate?.(value)||value):value;
      const profile=shadow.querySelector(".qb-sidebar-profile");if(profile){const name=profile.querySelector("strong"),role=profile.querySelector("small");if(name)name.textContent="Anna Zhang";if(role)role.textContent=localize("量化探索者")}
      const data=readWorkspace(),strategy=findById(data.strategies,appState.backtestStrategyId||"base")||data.strategies[0];
      if(!strategy||strategy.status!=="backtested"){
        const view=shadow.getElementById("backtest-view"),placeholder=shadow.getElementById("placeholder-view");
        if(view)view.hidden=true;
        if(placeholder){placeholder.hidden=false;const title=shadow.getElementById("placeholder-title");if(title)title.textContent="该策略尚无历史回测";const paragraph=placeholder.querySelector("p");if(paragraph)paragraph.textContent="个人草稿或 Community Fork 不会自动获得基准策略的历史结果。";const button=shadow.getElementById("back-backtest");if(button){button.textContent="返回我的策略";button.onclick=()=>{location.hash="#strategy"}}}
      }else{
        const title=shadow.getElementById("strategy-name");if(title)title.textContent=localize(strategy.name);
      }
    }
    function normalizeIdentity(shadow){
      shadow.querySelectorAll(".profile strong,.profile b,.qb-sidebar-profile strong").forEach(node=>{if(node.textContent.trim()==="小白探索者")node.textContent="Anna Zhang"});
    }
    function integrateCurrent(){
      const host=document.getElementById("qb-host"),view=host?.querySelector("qb-source-view");if(!view?.shadowRoot)return;
      const shadow=view.shadowRoot,route=(location.hash||"#onboarding/welcome").slice(1);
      if(!shadow.__qbObserve){
        shadow.__qbObserve=true;
        const observer=new MutationObserver(()=>{clearTimeout(shadow.__qbTimer);shadow.__qbTimer=setTimeout(()=>decorate(shadow,(location.hash||"").slice(1)),0)});
        observer.observe(shadow,{childList:true,subtree:true});
      }
      decorate(shadow,route);
    }
    function decorate(shadow,route){
      if(shadow.__qbDecorating)return;shadow.__qbDecorating=true;
      try{
        normalizeIdentity(shadow);
        if(route==="strategy"||route.startsWith("strategy/create/"))decorateWorkspace(shadow,route);
        else if(route==="community"||route.startsWith("community/post/"))decorateCommunity(shadow,route);
        else if(route.startsWith("community/publish/"))decoratePublish(shadow,route);
        else if(route==="backtest")decorateBacktest(shadow);
      }finally{shadow.__qbDecorating=false}
    }
    window.QBIntegrationBeforeRoute=(element,targetRoute,module)=>{
      if(targetRoute==="backtest"){
        const id=element.closest(".card")?.dataset.strategyId||"base";
        appState.backtestStrategyId=id;saveState();
      }
    };
    const hostObserver=new MutationObserver(()=>setTimeout(integrateCurrent,0));
    const start=()=>{const host=document.getElementById("qb-host");if(host){hostObserver.observe(host,{childList:true,subtree:false});setTimeout(integrateCurrent,0)}};
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start);else start();
    window.addEventListener("hashchange",()=>setTimeout(integrateCurrent,0));
  })();
